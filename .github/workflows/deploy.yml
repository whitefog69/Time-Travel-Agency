name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN needs to write Pages and mint the deployment's OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Sets GITHUB_PAGES / NEXT_PUBLIC_STATIC_EXPORT, so the build picks up the
      # /Time-Travel-Agency base path and drops the server-only chat route.
      #
      # CHAT_API_URL points the widget at the API hosted elsewhere (see README).
      # It is a repository *variable*, not a secret — NEXT_PUBLIC_* values are
      # inlined into the client bundle and are public by definition. The Mistral
      # key stays on that API host and never enters this build.
      - run: npm run build:static
        env:
          NEXT_PUBLIC_CHAT_API_URL: ${{ vars.CHAT_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
